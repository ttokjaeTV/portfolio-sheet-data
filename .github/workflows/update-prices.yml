name: 시세 CSV 갱신

on:
  schedule:
    # UTC 기준. KST = UTC+9
    # 00:00~06:50 UTC = 09:00~15:50 KST (국내 장중), 평일만
    - cron: "*/10 0-6 * * 1-5"
    # 국내 마감 정산 + 미국 종가 반영 (16:40 KST / 07:10 KST)
    - cron: "40 7 * * 1-5"
    - cron: "10 22 * * 1-5"
    # 미국 장중 (뉴욕 09:30~16:00). 네이버 미국 시세는 delayTime 0 = 실시간이라
    # 받아오기만 하면 된다.
    #   서머타임(EDT) 13:30~20:00 UTC = 22:30~05:00 KST
    #   표준시  (EST) 14:30~21:00 UTC = 23:30~06:00 KST
    # ★ UTC 로는 자정을 넘지 않는다. 한국시간으로 보면 날짜가 바뀌어 헷갈리지만
    #   크론은 UTC 기준이므로 요일도 1-5 그대로면 된다. 13-21 이면 두 계절 다 덮는다.
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 주요 지수 + 환율
        run: python scripts/build_indices.py

      - name: 지수 일별 이력 (상황판 차트)
        run: python scripts/build_index_history.py

      - name: 국내 ETF 시세
        run: python scripts/build_etf_prices.py

      - name: 국내 개별주식 시세
        run: python scripts/build_kr_stocks.py

      - name: 미국 시세 + 환율
        run: python scripts/build_us_prices.py

      - name: 변경분만 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "변경 없음"; exit 0
          fi
          git add data/
          git commit -m "시세 갱신: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
