name: 미국 종목 심볼 갱신

# us_symbols.json 은 build_us_prices.py 가 읽는 티커→reutersCode 캐시다.
# 네이버 미국 reutersCode 는 규칙이 없어 종목마다 조회해야 하므로 느리다.
# 그래서 15분 주기 시세 워크플로에는 넣지 않고 주 1회만 돌린다.
#
# 이걸 안 돌리면 신규 상장 미국 종목이 도구에서 검색되지 않는다.
on:
  schedule:
    # 일요일 05:10 KST (토 20:10 UTC) — 미국장 닫힌 뒤, 주간 시세 시작 전
    - cron: "10 20 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-us-symbols
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 미국 심볼 캐시 갱신
        run: python scripts/build_us_symbols.py

      - name: 변경분만 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/us_symbols.json; then
            echo "변경 없음"; exit 0
          fi
          git add data/us_symbols.json
          git commit -m "미국 심볼 갱신: $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 거절 — pull --rebase 후 재시도 ($i/3)"
            git pull --rebase origin master || exit 1
          done
          exit 1
