name: 백테스트 데이터 월간 갱신

# 백테스트 계산기(backtest/)가 쓰는 가격·배당·환율 이력을 매달 한 번 이어 붙이고 data/bt 를 다시 만든다.
# 매월 2일 06:23 KST (1일 21:23 UTC) — 지난달 마지막 거래일 종가가 모두 확정된 뒤.
# ★ 분(分)은 :00 을 피한다 (정각 예약은 건너뛰는 일이 많다).
on:
  schedule:
    - cron: "23 21 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-monthly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pykrx 설치
        run: pip install --quiet "pykrx==1.2.8" pandas

      # 각 단계는 실패해도 다음 단계로 간다 — 지난달 파일이 남아 있으므로 한 소스가 막혀도 나머지는 갱신한다.
      - name: 국내 ETF 가격 (네이버, 증분)
        continue-on-error: true
        run: python scripts/build_price_history.py kr_etf
      - name: 국내 주식 가격 (네이버, 증분)
        continue-on-error: true
        run: python scripts/build_price_history.py kr_stock
      - name: KRX 월말 시세 (ETF·주식)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/build_krx_history.py etf stock > /dev/null
      - name: 미국 가격·배당·분할 (야후)
        continue-on-error: true
        run: python scripts/build_yahoo_history.py us
      - name: 국내 분할 이력 (야후)
        continue-on-error: true
        run: python scripts/build_yahoo_history.py kr_split
      - name: 국내 분배금·배당 (세이브로, 최근 분기)
        continue-on-error: true
        run: |
          python scripts/build_dividend_history.py etf
          python scripts/build_dividend_history.py stock
      - name: 원달러 환율
        continue-on-error: true
        run: python scripts/build_fx_history.py
      - name: 품질 점검 · 미국 주요 종목 대조
        continue-on-error: true
        run: |
          python scripts/check_history_quality.py
          python scripts/check_us_reference.py
      - name: 백테스트용 데이터 정리 (data/bt)
        run: python scripts/build_backtest_data.py

      - name: 변경분만 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/bt
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "백테스트 데이터 월간 갱신: $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 거절 — pull --rebase 후 재시도 ($i/3)"
            git pull --rebase origin master || exit 1
          done
          exit 1
